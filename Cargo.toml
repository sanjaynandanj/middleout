[package]
name = "middleout"
version = "0.1.0"
edition = "2024"
description = "Middle-out compression, Pied Piper style. Optimal tip-to-tip efficiency."
license = "MIT"
repository = "https://github.com/sanjaynandanj/middleout"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "middleout"
required-features = ["cli"]

[features]
default = ["cli"]
cli = ["dep:clap", "dep:flate2", "dep:zstd"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"], optional = true }
flate2 = { version = "1", optional = true }
zstd = { version = "0.13", optional = true }

[profile.release]
lto = true
codegen-units = 1
